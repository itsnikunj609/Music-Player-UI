<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>'Spotify - Web Player: Music for everyone'</title>
    <link rel="stylesheet" href="style2.css">
    <link rel="icon" href="https://open.spotify.com/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <div class="header">
        <div class="left">
            <span><img class="logo" src="img/logo.svg" alt="Spotify"></span>
            <span class="homebtn">
                <button class="btn1">
                    <img class="home-icon" src="img/home.svg" alt="Home">
                </button>
            </span>
            <span>
                <button class="btn2">
                    <span><img class="search-icon" src="img/search.svg" alt=""></span>
                    <span class="visibility">
                        What do you want to Play?
                    </span>
                </button>
            </span>
        </div>
        <div class="right">
            <span class="box1">
                <ul>
                    <li>Premium</li>
                    <li>Support</li>
                    <li>Download</li>
                </ul>
            </span>
            <span class="line">
                <h1>|</h1>
            </span>
            <span class="box2">
                <ul>
                    <li class="image"><img class="install" src="img/install.svg" alt="install">Install App</li>
                    <li>Sign up</li>
                    <li><button class="btn3">Log in</button></li>


                </ul>

            </span>

        </div>
    </div>
    <div class="container">
        <div class="leftcontainer">
            <div class="container1">
                <h4>Your Library</h4>
                <button class="btn4">
                    <img class="create" src="img/create.svg" alt="create">
                    create
                </button>
                <div class="close">
                    <img src="img/cross.svg" alt="">
                </div>
            
            </div>
            <div class="songlist">
                <ul>
                    <li><img class="music" src="img/music.svg" alt="">
                        <div class="info">
                            <div>song name</div>
                            <div>song artist</div>
                        </div> 
                        <div class="playnow">
                            <span>play now</span>
                            <img class="play-icon2" src="img/play.svg" alt="">
                        </div>   
                          
                    </li>


                </ul>
            </div>

            <!-- <div class="container2">
                <h3>Create Your First Playlist</h3>
                <h4>It's easy we'll help you</h4>
                <button class="btn5">
                    Create playlists
                </button>
            </div>

            <div class="container3">
                <h3>Let's find some podcasts to follow</h3>
                <h4>we'll keep you updated on new episodes</h4>
                <button class="btn6">
                    Browse Podcasts
                </button>
            </div>-->

            <div class="container4">
                <div class="footer1">
                    <a href="https://www.spotify.com/in-en/legal/">
                        Legal
                    </a>
                    <a href="https://www.spotify.com/in-en/safetyandprivacy/">
                        Safety & Privacy Center
                    </a>
                    <a href="https://www.spotify.com/in-en/legal/privacy-policy/">
                        Privacy Policy
                    </a>
                    <a href="https://www.spotify.com/in-en/legal/cookies-policy/">
                        Cookies
                    </a>

                </div>
                <div class="footer2">
                    <a href="https://www.spotify.com/in-en/legal/privacy-policy/#s3">
                        About Ads
                    </a>

                    <a href="https://www.spotify.com/in-en/accessibility/">
                        Accessibility
                    </a>

                </div>
            </div>

        </div>
        <div class="rightcontainer">
            <div class="header2">
                <img class="hamburger" src="img/hamburger.svg" alt="">
                <h1>Trending songs</h1>
                show all
            </div>
            <div class="cardcontainer">
              
            </div>

            <div class="playbar">
                <div class="seekbar">
                    <div class="circle"></div>
                </div>
                <div class="abovebar">
                    <div class="songinfo"></div>
                    
                     <div class="songbuttons">
                    <img width="35px" id="previous" class="previous" src="img/previous.svg" alt="">
                    <img width="35px" id="play" class="playbutton" src="img/play.svg" alt="">
                    <img width="35px" id="next" class="next" src="img/nextsong.svg" alt="">
                </div>
                <div class="timevol">
                     <div class="songtime"></div>
               
                
                 <div class="volume">
                    <img width="30 px" src="img/volume.svg" alt="">
                    <div class="range">
                         <input width="5px" type="range" name="volume">
                    </div>
                </div>

                </div>
                
                
                 
                 
               

            </div>












        </div>
    </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
